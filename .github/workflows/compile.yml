name: Compile check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  javac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every solution
        run: python scripts/check.py
